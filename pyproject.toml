[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch_predictor"
version = "0.1.0"
description = "Baseball ML pitch predictor running on Databricks with AutoML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "databricks-sdk>=0.20.0",
    "mlflow>=2.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pybaseball>=2.2.7",
    "streamlit>=1.30.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
vision = [
    "opencv-python>=4.8.0,<5.0.0",
    "mediapipe>=0.10.9",
    "requests>=2.31.0",
    "shap>=0.44.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
