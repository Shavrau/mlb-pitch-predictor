resources:
  model_serving_endpoints:
    pitch_predictor_endpoint:
      name: pitch_predictor_endpoint_${bundle.target}
      config:
        served_entities:
          - name: multimodal_pitch_predictor_prod
            entity_name: ${var.catalog}.${var.schema}.${var.model_name}
            entity_version: "${var.model_version}"
            workload_size: Small
            scale_to_zero_enabled: true
        traffic_config:
          routes:
            - served_model_name: multimodal_pitch_predictor_prod
              traffic_percentage: 100
