resources:
  jobs:
    pitch_predictor_job:
      name: pitch_predictor_job_${bundle.target}

      # Serverless compute configuration (STANDARD: cost-efficient batch on Serverless)
      performance_target: STANDARD

      # Daily scheduled run at 06:00 AM (America/Sao_Paulo) after all night MLB games conclude
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      tasks:
        - task_key: setup_environment
          notebook_task:
            notebook_path: ../notebooks/00_setup_environment.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
          environment_key: default

        - task_key: data_ingestion
          depends_on:
            - task_key: setup_environment
          notebook_task:
            notebook_path: ../notebooks/01_data_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              start_dt: ${var.start_dt}
              end_dt: ${var.end_dt}
              earliest_season_limit: ${var.earliest_season_limit}
          environment_key: default

        - task_key: bronze_declarative_pipeline
          depends_on:
            - task_key: data_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.pitch_predictor_pipeline.id}

        - task_key: video_biomechanics_pipeline
          depends_on:
            - task_key: bronze_declarative_pipeline
          notebook_task:
            notebook_path: ../notebooks/04_video_biomechanics_pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              pitcher_id: "694973"
              max_pitches: "15"
              sync_models: "true"
          environment_key: default

        - task_key: automl_training
          depends_on:
            - task_key: bronze_declarative_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_automl_run.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table_name: silver_pitch_features
              timeout_minutes: "15"
          environment_key: default

        - task_key: model_inference
          depends_on:
            - task_key: automl_training
          notebook_task:
            notebook_path: ../notebooks/03_model_inference.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_alias: prod
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pybaseball>=2.2.7
              - scikit-learn>=1.3.0
              - xgboost>=2.0.0
              - lightgbm>=4.0.0
              - mlflow>=2.10.0
              - opencv-python-headless>=4.8.0
              - mediapipe>=0.10.9
              - shap>=0.44.0
              - --editable ${workspace.file_path}

